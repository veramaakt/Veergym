# Conda-omgeving voor Veergym. Aanmaken:  conda env create -f environment.yml
# Bijwerken na wijzigingen:               conda env update -f environment.yml --prune
name: veergym
channels:
  - conda-forge
dependencies:
  - python=3.12
  - fastapi>=0.115
  - uvicorn>=0.30
  - sqlmodel>=0.0.22
  - python-dotenv>=1.0
  - python-multipart
  - openpyxl>=3.1
  - pytest>=8
  - httpx>=0.27
